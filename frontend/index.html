<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Transmití tu foto</title>
    <!-- La marca (src/comp/Marca.tsx): el cuadrado azul con la cámara de
         heroicons. El SVG es la pestaña; el PNG, el ícono que guarda el iPhone
         al agregar el panel a la pantalla de inicio (180 px, sin esquinas:
         iOS las recorta solo). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- El tema antes del primer cuadro, sin esperar a React: sin esto, quien
         eligió claro ve un destello negro al abrir el panel. Misma clave y
         mismas reglas que src/lib/tema.ts. El invitado (/e/…) y la pantalla
         (/p y /p/…) son siempre oscuros. -->
    <script>
      (function () {
        var tema = "oscuro";
        if (!/^\/(e|p)(\/|$)/.test(location.pathname)) {
          var elegido = null;
          try {
            elegido = localStorage.getItem("transmiti.tema");
          } catch (e) {}
          if (elegido === "claro") tema = "claro";
          else if (elegido !== "oscuro" && window.matchMedia && !matchMedia("(prefers-color-scheme: dark)").matches)
            tema = "claro";
        }
        document.documentElement.setAttribute("data-tema", tema);
        if (tema === "claro")
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#F2F2F7");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
